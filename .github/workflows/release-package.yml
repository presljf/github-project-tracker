# TEMPORARY probe (T02 validation): exercise workflow_dispatch -> local reusable workflow calling
# mechanics with the known-good reusable-ci contract. Restored before the final commit.
name: Release (package example)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'probe'
        required: false
        type: string
        default: ''
      dry-run:
        description: 'probe'
        required: false
        type: boolean
        default: true
      publish:
        description: 'probe'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    name: probe
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-release.yml
    with:
      profile: generic
      dry-run: true
      publish: false
