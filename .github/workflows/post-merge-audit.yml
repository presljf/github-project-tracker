# Thin self caller for reusable-post-merge-audit.yml (dogfooding the adopter contract).
# Check context: `post-merge-audit / audit`.
#
# Least privilege is granted here (the reusable workflow declares the same set; callers must grant
# at least that union): issues: write opens the tracker-contract-exception OI/label, checks/
# statuses/actions read are required for statusCheckRollup. `tracker-ref: ''` is self mode — the
# audit script comes from this checkout, not a pinned template tag.
name: Post-merge bypass audit

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'Merged PR number to audit (required for manual dispatch).'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: post-merge-audit-${{ github.event.pull_request.number || inputs['pr-number'] }}
  cancel-in-progress: false

jobs:
  post-merge-audit:
    name: post-merge-audit
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    permissions:
      contents: read
      issues: write
      pull-requests: read
      checks: read
      statuses: read
      actions: read
    uses: ./.github/workflows/reusable-post-merge-audit.yml
    with:
      tracker-ref: ''
      config-path: tracker.config.json
      pr-number: ${{ github.event_name == 'workflow_dispatch' && inputs['pr-number'] || '' }}
