# Reusable release pipelines for Project Tracker OS adopters (T10 release profile).
#
# Contract source of truth: docs/ACTIONS_CATALOG.md §7.5 (interface), §2.4 (catalog entry),
# §9 (guards). This workflow delivers that contract; docs/RELEASE_PROFILES.md documents the
# delivered inputs/outputs/secrets/permissions and every profile in detail.
#
# Safety model (non-negotiable):
# - dry-run is the default; it builds, checksums, and validates without publishing anything.
# - publishing requires a `v*` tag ref matching `tag-pattern` (or a workflow_dispatch run that
#   selected a release tag ref) AND `publish: true` AND `dry-run: false`, and it always runs in
#   the protected `release` environment (required reviewers are configured in the adopting repo).
# - no `pull_request` trigger exists here and every publish job also asserts the event is not a
#   pull request; fork PRs can never reach a publish path.
# - no secrets are printed; signing/publishing secrets are optional and empty means
#   "skip cleanly" (the macOS profile falls back to ad-hoc signing with an explicit warning,
#   never a silent unsigned publish).
# - checksums are generated after signing, verified in the release job, and shipped as
#   `SHA256SUMS` (or `SHA512SUMS` for the sha512 algorithm).
# - third-party actions are pinned by full commit SHA. A reusable workflow cannot rely on local
#   composite actions from this repository when called cross-repo (the `./` action path resolves
#   against the caller checkout), so the checksum/signing logic is inlined here for reusable
#   mode. The `checksum` and `sign-notarize-macos` composite actions are the copy-mode/local
#   contract (see profiles/release/** and docs/RELEASE_PROFILES.md).
#
# Adoption-contract gate (opt-in, default `false`): when `contract-gate: true`, the `contract_gate`
# job runs `verify-tooling` + `verify-contract` + the offline half of `release-gate` against the
# pinned tracker checkout BEFORE build. It requests `contents: read` only, so every existing caller
# (contents/packages/id-token write) stays valid and default-false runs are unchanged. The open-OI
# half of release-gate (`--repo`) needs `issues: read`; requiring that here would invalidate every
# caller that does not grant it at pin-upgrade time (GitHub validates the permission graph even for
# skipped jobs), so the open-OI check remains an explicit release-procedure step
# (`npm run gate:release -- --repo owner/repo`) documented in docs/ACTIONS_CATALOG.md §7.5.
name: Reusable Release

on:
  workflow_call:
    inputs:
      profile:
        description: >-
          Release profile: generic (GitHub Release assets), macos (dmg/zip with optional
          signing/notarization), container (GHCR image), package (npm/PyPI). Aliases documented
          in docs/RELEASE_PROFILES.md.
        type: string
        required: false
        default: generic
      version:
        description: >-
          Version to release (for example v1.0.0 or 1.0.0). Empty derives it from the tag ref;
          a dry-run dispatch may omit it and uses 0.0.0-dryrun.
        type: string
        required: false
        default: ''
      tag-pattern:
        description: >-
          POSIX extended regex a release tag must match. `\d` is accepted as shorthand for
          `[0-9]`. The tag must be `v` + the resolved version.
        type: string
        required: false
        default: '^v[0-9]+\.[0-9]+\.[0-9]+$'
      dry-run:
        description: >-
          Build, validate, and checksum only; never create a release or publish. Default true.
        type: boolean
        required: false
        default: true
      publish:
        description: >-
          Request publishing. Honored only with a matching tag ref, `dry-run: false`, and the
          protected `release` environment. Default false.
        type: boolean
        required: false
        default: false
      artifact-globs:
        description: >-
          Newline-separated globs (for example dist/**) uploaded as the release artifacts,
          relative to the repository root. Must match at least one file (fail closed).
        type: string
        required: false
        default: 'dist/**'
      checksum-algorithm:
        description: 'Checksum algorithm: sha256 (default) or sha512.'
        type: string
        required: false
        default: sha256
      build-command:
        description: >-
          Shell command run from working-directory to produce the release artifacts. Empty uses
          the profile default (container: docker build; package: npm pack or python -m build;
          generic/macos: expect artifacts to already exist).
        type: string
        required: false
        default: ''
      working-directory:
        description: 'Directory the build command runs in, relative to the repository root.'
        type: string
        required: false
        default: '.'
      node-version:
        description: 'Node.js version for Node-based builds/publishing. Empty skips Node setup.'
        type: string
        required: false
        default: '22'
      macos-runner:
        description: 'macOS runner label used by the macos profile.'
        type: string
        required: false
        default: macos-15
      macos-team-id:
        description: 'Apple Developer team ID used for signing/notarization (non-secret; required to notarize).'
        type: string
        required: false
        default: ''
      macos-signing-identity:
        description: 'codesign identity used for Developer ID signing.'
        type: string
        required: false
        default: 'Developer ID Application'
      image-name:
        description: >-
          Container image repository for the container profile (no tag). Empty defaults to
          ghcr.io/<owner>/<repo> (lowercase).
        type: string
        required: false
        default: ''
      package-registries:
        description: >-
          Optional package registry override for the package profile. Empty auto-detects from
          the build output (npm tarball and/or PyPI wheel/sdist); values are comma-separated
          `npm` and/or `pypi`.
        type: string
        required: false
        default: ''
      artifact-name:
        description: 'Base name for uploaded workflow artifacts.'
        type: string
        required: false
        default: release-artifacts
      retention-days:
        description: 'Retention in days for uploaded artifacts.'
        type: number
        required: false
        default: 30
      release-name:
        description: 'GitHub Release title. Empty defaults to the validated tag.'
        type: string
        required: false
        default: ''
      draft:
        description: 'Create the GitHub Release as a draft (default true; a human publishes it).'
        type: boolean
        required: false
        default: true
      prerelease:
        description: 'Mark the GitHub Release as a prerelease.'
        type: boolean
        required: false
        default: false
      contract-gate:
        description: >-
          Run verify-tooling + verify-contract + the offline release gate before build (opt-in;
          default false). Requesting contents: read only keeps existing caller permission grants
          valid; the open-OI half of release-gate stays a release-procedure step.
        type: boolean
        required: false
        default: false
      tracker-ref:
        description: >-
          Exact template release tag (`@v<version>`) used only by the opt-in contract gate to load the adoption contract
          and verification tooling. Ignored when this workflow runs in the template repository itself.
        type: string
        required: false
        default: v1.3.2
      contract-path:
        description: >-
          Adoption contract path for the opt-in contract gate (repository-root-relative or absolute).
          Empty auto-detects contract/adoption-contract.json in the template repository and
          .tracker/contract/adoption-contract.json downstream.
        type: string
        required: false
        default: ''
      config-path:
        description: >-
          Tracker config path honoured by verify-tooling, verify-contract, and release-gate in the
          opt-in contract gate (repository-root-relative or absolute).
        type: string
        required: false
        default: tracker.config.json
    outputs:
      version:
        description: 'Validated semantic version (without leading v).'
        value: ${{ jobs.prepare.outputs.version }}
      artifacts:
        description: 'Newline-separated artifact file list relative to the release bundle root.'
        value: ${{ jobs.checksum.outputs.artifact-list }}
      checksums-file:
        description: 'Checksum file name (SHA256SUMS or SHA512SUMS).'
        value: ${{ jobs.checksum.outputs.checksums-file }}
      release-url:
        description: 'Created GitHub Release URL; empty on dry-run.'
        value: ${{ jobs.release.outputs.release-url }}
      dry-run:
        description: "'true' when the run did not publish."
        value: ${{ jobs.prepare.outputs.dry-run }}
    secrets:
      RELEASE_TOKEN:
        description: >-
          Optional token used instead of github.token for publishing (only when org policy
          forbids the default token). Never required for dry-runs.
        required: false
      MACOS_CERT_P12:
        description: 'Optional base64 Developer ID Application certificate (.p12) for macOS signing.'
        required: false
      MACOS_CERT_PASSWORD:
        description: 'Optional password for MACOS_CERT_P12.'
        required: false
      APPLE_ID:
        description: 'Optional Apple ID for notarization (notarytool).'
        required: false
      APPLE_APP_PASSWORD:
        description: 'Optional app-specific password for notarization.'
        required: false
      NPM_TOKEN:
        description: >-
          Optional npm automation token. Preferred path is npm trusted publishing (OIDC) with
          `id-token: write`; pass this only when OIDC is unavailable.
        required: false
      PYPI_API_TOKEN:
        description: >-
          Optional PyPI API token. Preferred path is PyPI trusted publishing (OIDC); pass this
          only when OIDC is unavailable.
        required: false

# Least privilege: start with nothing and grant per job.
permissions: {}

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      profile: ${{ steps.resolve.outputs.profile }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      dry-run: ${{ steps.resolve.outputs.dry-run }}
      should-publish: ${{ steps.resolve.outputs.should-publish }}
      runner: ${{ steps.resolve.outputs.runner }}
      artifact-globs: ${{ steps.resolve.outputs.artifact-globs }}
      build-command: ${{ steps.resolve.outputs.build-command }}
      working-directory: ${{ steps.resolve.outputs.working-directory }}
      checksum-algorithm: ${{ steps.resolve.outputs.checksum-algorithm }}
      checksums-file: ${{ steps.resolve.outputs.checksums-file }}
      image-name: ${{ steps.resolve.outputs.image-name }}
      release-name: ${{ steps.resolve.outputs.release-name }}
    steps:
      - name: Validate inputs and resolve version/tag
        id: resolve
        env:
          PROFILE_INPUT: ${{ inputs.profile }}
          VERSION_INPUT: ${{ inputs.version }}
          TAG_PATTERN_INPUT: ${{ inputs.tag-pattern }}
          DRY_RUN_INPUT: ${{ inputs.dry-run }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          ARTIFACT_GLOBS_INPUT: ${{ inputs.artifact-globs }}
          ALGORITHM_INPUT: ${{ inputs.checksum-algorithm }}
          BUILD_COMMAND_INPUT: ${{ inputs.build-command }}
          WORKDIR_INPUT: ${{ inputs.working-directory }}
          MACOS_RUNNER_INPUT: ${{ inputs.macos-runner }}
          IMAGE_NAME_INPUT: ${{ inputs.image-name }}
          RELEASE_NAME_INPUT: ${{ inputs.release-name }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          fail() { echo "::error::$*"; exit 1; }
          note() { echo "::notice::$*"; }

          profile_raw="$(printf '%s' "${PROFILE_INPUT:-generic}" | tr '[:upper:]' '[:lower:]')"
          case "$profile_raw" in
            generic|github-release) profile="generic" ;;
            macos|desktop|macos-app-github-release) profile="macos" ;;
            container|ghcr|image) profile="container" ;;
            package|npm|pypi|npm-pypi|packages) profile="package" ;;
            *) fail "Unsupported profile '${PROFILE_INPUT}'. Use generic, macos, container, or package (see docs/RELEASE_PROFILES.md)." ;;
          esac

          workdir="${WORKDIR_INPUT:-.}"
          [[ -n "$workdir" ]] || fail "working-directory must not be empty."
          [[ "$workdir" != /* ]] || fail "working-directory must be repository-relative, got '${workdir}'."

          algorithm="$(printf '%s' "${ALGORITHM_INPUT:-sha256}" | tr '[:upper:]' '[:lower:]')"
          case "$algorithm" in
            sha256) checksums_file="SHA256SUMS" ;;
            sha512) checksums_file="SHA512SUMS" ;;
            *) fail "Unsupported checksum-algorithm '${ALGORITHM_INPUT}'; use sha256 or sha512." ;;
          esac

          globs="${ARTIFACT_GLOBS_INPUT:-dist/**}"
          [[ -n "$(printf '%s' "$globs" | tr -d '[:space:]')" ]] || fail "artifact-globs must contain at least one glob."

          dry_run="$(printf '%s' "${DRY_RUN_INPUT:-true}" | tr '[:upper:]' '[:lower:]')"
          publish="$(printf '%s' "${PUBLISH_INPUT:-false}" | tr '[:upper:]' '[:lower:]')"
          case "$dry_run" in true|false) ;; *) fail "dry-run must be a boolean." ;; esac
          case "$publish" in true|false) ;; *) fail "publish must be a boolean." ;; esac

          ref_type="${REF_TYPE:-}"
          ref_name="${REF_NAME:-}"

          # Tag pattern is POSIX ERE; accept the documented `\d` shorthand by translating it.
          pattern="${TAG_PATTERN_INPUT:-^v[0-9]+\.[0-9]+\.[0-9]+$}"
          pattern="${pattern//\\d/[0-9]}"

          if [[ -n "${VERSION_INPUT:-}" ]]; then
            version="${VERSION_INPUT#v}"
          elif [[ "$ref_type" == "tag" ]]; then
            version="${ref_name#v}"
          elif [[ "$dry_run" == "true" ]]; then
            version="0.0.0-dryrun"
            note "No version input on a dry-run dispatch; validating the pipeline with placeholder version ${version}."
          else
            fail "Publishing requires a tag ref, or an explicit version input when dispatching on a tag ref."
          fi

          semver_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          [[ "$version" =~ $semver_re ]] || fail "Version '${version}' is not a valid semantic version (expected e.g. 1.2.3 or 1.2.3-rc.1)."

          tag="v${version}"
          tag_matches="false"
          if [[ "$ref_type" == "tag" ]]; then
            [[ "$ref_name" =~ $pattern ]] || fail "Tag '${ref_name}' does not match tag-pattern '${TAG_PATTERN_INPUT:-^v[0-9]+\.[0-9]+\.[0-9]+$}'. Release tags are authorization boundaries; refusing to continue."
            [[ "$ref_name" == "$tag" ]] || fail "Tag '${ref_name}' does not match resolved version tag '${tag}'. Refusing to release a mislabelled tag."
            tag_matches="true"
          fi

          if [[ "$publish" == "true" && "$dry_run" == "true" ]]; then
            fail "publish: true with dry-run: true is contradictory. Set dry-run: false for a publish run, or publish: false for a dry-run."
          fi
          if [[ "$publish" == "true" && "$tag_matches" != "true" ]]; then
            fail "publish: true requires a release tag ref matching the tag pattern (dispatch on the release tag, or push the tag). Refusing to publish from '${ref_name:-<none>}'."
          fi
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "pull_request_target" ]]; then
            fail "Publishing is never allowed from pull_request events."
          fi

          should_publish="false"
          if [[ "$publish" == "true" && "$dry_run" == "false" && "$tag_matches" == "true" ]]; then
            should_publish="true"
          fi

          case "$profile" in
            macos) runner="${MACOS_RUNNER_INPUT:-macos-15}" ;;
            *) runner="ubuntu-latest" ;;
          esac

          if [[ "$profile" == "container" && "$workdir" != "." ]]; then
            fail "The container profile builds/saves from the repository root; set working-directory to '.' (got '${workdir}')."
          fi

          if [[ -n "${IMAGE_NAME_INPUT:-}" ]]; then
            image_name="${IMAGE_NAME_INPUT}"
          else
            image_name="ghcr.io/$(printf '%s' "${REPOSITORY:-owner/repo}" | tr '[:upper:]' '[:lower:]')"
          fi
          [[ "$image_name" =~ ^[a-z0-9./_-]+$ ]] || fail "image-name '${image_name}' must be lowercase (registry/repository) without a tag."

          release_name="${RELEASE_NAME_INPUT:-$tag}"

          {
            echo "profile=${profile}"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "dry-run=${dry_run}"
            echo "should-publish=${should_publish}"
            echo "runner=${runner}"
            echo "checksum-algorithm=${algorithm}"
            echo "checksums-file=${checksums_file}"
            echo "image-name=${image_name}"
            echo "release-name=${release_name}"
            echo "working-directory=${workdir}"
            echo "artifact-globs<<__GLOBS__"
            printf '%s\n' "$globs"
            echo "__GLOBS__"
            echo "build-command<<__BUILD__"
            printf '%s\n' "${BUILD_COMMAND_INPUT:-}"
            echo "__BUILD__"
          } >> "$GITHUB_OUTPUT"

          echo "profile=${profile} version=${version} tag=${tag} dry-run=${dry_run} publish=${publish} should-publish=${should_publish} ref-type=${ref_type} ref=${ref_name}"

      - name: Write release summary
        env:
          PROFILE: ${{ steps.resolve.outputs.profile }}
          VERSION: ${{ steps.resolve.outputs.version }}
          TAG: ${{ steps.resolve.outputs.tag }}
          DRY_RUN: ${{ steps.resolve.outputs.dry-run }}
          SHOULD_PUBLISH: ${{ steps.resolve.outputs.should-publish }}
          CHECKSUM_ALGORITHM: ${{ steps.resolve.outputs.checksum-algorithm }}
        run: |
          {
            echo "## Release validation"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Profile | \`${PROFILE}\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Tag | \`${TAG}\` |"
            echo "| Dry run | \`${DRY_RUN}\` |"
            echo "| Publish requested (guarded) | \`${SHOULD_PUBLISH}\` |"
            echo "| Checksum | \`${CHECKSUM_ALGORITHM}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Opt-in adoption-contract gate. Its own job keeps the checks and their failure boundary explicit:
  # `build` waits for it when enabled and ignores it when disabled. It reads the contract/tooling
  # from the pinned tracker checkout (downstream) or the caller checkout (self mode) and requests
  # `contents: read` only, so existing callers stay valid. No artifacts and no writes.
  contract_gate:
    name: contract-gate
    if: ${{ inputs.contract-gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Checkout tracker contract and tooling
        if: ${{ github.repository != 'presljf/github-project-tracker' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: presljf/github-project-tracker
          ref: ${{ inputs.tracker-ref }}
          path: .tracker
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Resolve contract gate paths
        id: paths
        env:
          CONFIG_PATH_INPUT: ${{ inputs.config-path }}
          CONTRACT_PATH_INPUT: ${{ inputs.contract-path }}
          CANONICAL_REPOSITORY: presljf/github-project-tracker
        run: |
          set -euo pipefail

          if [ "${GITHUB_REPOSITORY:-}" = "$CANONICAL_REPOSITORY" ]; then
            mode="self"
            tracker="$GITHUB_WORKSPACE"
            default_contract="$GITHUB_WORKSPACE/contract/adoption-contract.json"
          else
            mode="downstream"
            tracker="$GITHUB_WORKSPACE/.tracker"
            default_contract="$GITHUB_WORKSPACE/.tracker/contract/adoption-contract.json"
          fi

          contract="${CONTRACT_PATH_INPUT:-}"
          if [ -z "$contract" ]; then
            contract="$default_contract"
          else
            case "$contract" in
              /*) ;;
              *) contract="$GITHUB_WORKSPACE/$contract" ;;
            esac
          fi
          config="${CONFIG_PATH_INPUT:-tracker.config.json}"
          case "$config" in
            /*) ;;
            *) config="$GITHUB_WORKSPACE/$config" ;;
          esac

          [ -f "$contract" ] || {
            echo "::error::adoption contract not found at '$contract' (mode=${mode}; pass contract-path or tracker-ref)."
            exit 1
          }
          [ -f "$config" ] || {
            echo "::error::tracker config not found at '$config' (mode=${mode})."
            exit 1
          }
          [ -f "$tracker/scripts/adopt/cli/verify-contract.mjs" ] || {
            echo "::error::verification tooling not found under '$tracker' (mode=${mode}; the contract gate needs tracker-ref v1.4.0+ with scripts/adopt/**)."
            exit 1
          }

          echo "mode=${mode}"
          echo "tracker=${tracker}" >> "$GITHUB_OUTPUT"
          echo "contract=${contract}" >> "$GITHUB_OUTPUT"
          echo "config=${config}" >> "$GITHUB_OUTPUT"
      - name: Fetch pinned tracker submodule tags
        run: |
          set -euo pipefail
          # verify-tooling checks the canonical `.tracker-os` path; the release gate keeps that
          # fixed convention (no separate submodule-path input).
          submodule_path=".tracker-os"
          if [ -d "$submodule_path" ] && git -C "$submodule_path" rev-parse --git-dir >/dev/null 2>&1; then
            echo "Fetching tags for tracker submodule '$submodule_path' (verify-tooling checks the pinned tag)."
            git -C "$submodule_path" fetch --tags --force
          else
            echo "::notice::No tracker submodule at '$submodule_path'; verify-tooling skips the pinned-submodule tag check."
          fi
      - name: Verify tooling contract
        env:
          TRACKER: ${{ steps.paths.outputs.tracker }}
          CONTRACT: ${{ steps.paths.outputs.contract }}
          CONFIG: ${{ steps.paths.outputs.config }}
        run: |
          set -euo pipefail
          node "$TRACKER/scripts/adopt/cli/verify-tooling.mjs" --root "$GITHUB_WORKSPACE" --contract "$CONTRACT" --tracker-config "$CONFIG"
      - name: Verify adoption contract
        env:
          TRACKER: ${{ steps.paths.outputs.tracker }}
          CONTRACT: ${{ steps.paths.outputs.contract }}
          CONFIG: ${{ steps.paths.outputs.config }}
        run: |
          set -euo pipefail
          node "$TRACKER/scripts/adopt/cli/verify-contract.mjs" --root "$GITHUB_WORKSPACE" --contract "$CONTRACT" --config "$CONFIG"
      - name: Run release gate (offline contract half)
        env:
          TRACKER: ${{ steps.paths.outputs.tracker }}
          CONTRACT: ${{ steps.paths.outputs.contract }}
          CONFIG: ${{ steps.paths.outputs.config }}
        run: |
          set -euo pipefail
          # No --repo: the open tracker-contract-exception OI check needs issues: read. Keeping this
          # job within contents: read preserves every existing caller grant (default-false runs must
          # not invalidate the permission graph). The open-OI step stays in the release procedure.
          node "$TRACKER/scripts/adopt/cli/release-gate.mjs" --root "$GITHUB_WORKSPACE" --contract "$CONTRACT" --config "$CONFIG"

  build:
    name: build
    needs: [prepare, contract_gate]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.contract_gate.result == 'success' || needs.contract_gate.result == 'skipped') }}
    runs-on: ${{ needs.prepare.outputs.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      package-kinds: ${{ steps.build.outputs.package-kinds }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout matches the release tag
        if: ${{ needs.prepare.outputs.should-publish == 'true' }}
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Release tag ${TAG} is not present in the checkout."
            exit 1
          fi
          head_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "${TAG}^{commit}")"
          if [[ "$head_sha" != "$tag_sha" ]]; then
            echo "::error::HEAD (${head_sha}) does not match ${TAG} (${tag_sha}); refusing to build a release from a different commit."
            exit 1
          fi
          echo "::notice::Building release ${TAG} at ${head_sha}."

      - name: Set up Node.js
        if: ${{ needs.prepare.outputs.profile != 'container' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: Build release artifacts
        id: build
        env:
          PROFILE: ${{ needs.prepare.outputs.profile }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DRY_RUN: ${{ needs.prepare.outputs.dry-run }}
          WORKDIR: ${{ needs.prepare.outputs.working-directory }}
          BUILD_COMMAND: ${{ needs.prepare.outputs.build-command }}
          ARTIFACT_GLOBS: ${{ needs.prepare.outputs.artifact-globs }}
          IMAGE_NAME: ${{ needs.prepare.outputs.image-name }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: |
          set -euo pipefail
          cd "${WORKDIR:-.}"

          if [[ -n "${BUILD_COMMAND:-}" ]]; then
            echo "::group::build-command"
            bash -euo pipefail -c "${BUILD_COMMAND}"
            echo "::endgroup::"
          else
            case "$PROFILE" in
              generic)
                echo "::notice::No build-command supplied; expecting committed/checked-in artifacts matching artifact-globs."
                ;;
              macos)
                echo "::notice::No build-command supplied; expecting dmg/zip artifacts matching artifact-globs. Supply a build-command to produce the app bundle."
                ;;
              container)
                echo "::notice::No build-command supplied; building the image from the repository root Dockerfile."
                docker build -t "${IMAGE_NAME}:${VERSION}" .
                ;;
              package)
                if [[ -f package.json ]]; then
                  mkdir -p dist
                  npm pack --pack-destination dist
                elif [[ -f pyproject.toml ]]; then
                  mkdir -p dist
                  python -m build --outdir dist
                else
                  echo "::error::package profile needs package.json or pyproject.toml, or an explicit build-command."
                  exit 1
                fi
                ;;
              *) echo "::error::Unknown profile '${PROFILE}'."; exit 1 ;;
            esac
          fi

          mkdir -p dist

          if [[ "$PROFILE" == "container" ]]; then
            image_ref="${IMAGE_NAME}:${VERSION}"
            if [[ -n "${BUILD_COMMAND:-}" ]]; then
              docker image inspect "$image_ref" >/dev/null 2>&1 || {
                echo "::error::Container build-command did not produce image ${image_ref}. Tag it with \$IMAGE_NAME:\$VERSION."
                exit 1
              }
            fi
            docker save "$image_ref" -o "dist/image-${VERSION}.tar"
            printf '{"image":"%s","version":"%s","commit":"%s"}\n' "$image_ref" "$VERSION" "${GITHUB_SHA:-unknown}" > "dist/container-metadata.json"
            echo "artifact-name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
            echo "package-kinds=" >> "$GITHUB_OUTPUT"
            echo "::notice::Prepared container image ${image_ref} as a workflow artifact (no push in dry-run; publish is guarded)."
            exit 0
          fi

          # Fail closed when nothing matches the artifact globs (a release without artifacts is a bug).
          # Portable across bash 3.2 (macOS hosted runners) and bash 5 (Ubuntu): avoid globstar.
          shopt -s nullglob
          files=()
          while IFS= read -r pattern; do
            [[ -z "$pattern" ]] && continue
            if [[ "$pattern" == *'**'* ]]; then
              base="${pattern%%/**/*}"
              suffix="${pattern##*/}"
              [[ -n "$base" ]] || base="."
              while IFS= read -r match; do
                files+=("$match")
              done < <(find "$base" -type f -name "$suffix" 2>/dev/null)
            else
              while IFS= read -r match; do
                files+=("$match")
              done < <(compgen -G "$pattern" || true)
            fi
          done <<< "$ARTIFACT_GLOBS"
          file_count=0
          for f in "${files[@]}"; do
            [[ -f "$f" ]] && file_count=$((file_count + 1))
          done
          if [[ "$file_count" -eq 0 ]]; then
            echo "::error::No files matched artifact-globs '${ARTIFACT_GLOBS}'."
            exit 1
          fi
          echo "::notice::Matched ${file_count} artifact file(s)."

          package_kinds=""
          if [[ "$PROFILE" == "package" ]]; then
            if compgen -G "dist/*.tgz" >/dev/null; then package_kinds="npm"; fi
            if compgen -G "dist/*.whl" >/dev/null || compgen -G "dist/*.tar.gz" >/dev/null; then
              package_kinds="${package_kinds:+${package_kinds},}pypi"
            fi
            [[ -n "$package_kinds" ]] || { echo "::error::package profile built no npm tarball, wheel, or sdist in dist/."; exit 1; }
            echo "::notice::Detected package registries: ${package_kinds}"
          fi

          {
            echo "artifact-name=${ARTIFACT_NAME}"
            echo "package-kinds=${package_kinds}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts
        if: ${{ needs.prepare.outputs.profile != 'container' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-globs }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

      - name: Upload container image artifact
        if: ${{ needs.prepare.outputs.profile == 'container' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            dist/image-*.tar
            dist/container-metadata.json
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  sign:
    name: sign-macos
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.profile == 'macos' && needs.prepare.outputs.dry-run == 'false' && needs.prepare.outputs.should-publish == 'true' }}
    runs-on: ${{ needs.prepare.outputs.runner }}
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
    outputs:
      signed-artifact-name: ${{ steps.record.outputs.signed-artifact-name }}
      signing-mode: ${{ steps.sign.outputs.signing-mode }}
      notarized: ${{ steps.sign.outputs.notarized }}
    steps:
      - name: Download unsigned macOS artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: signed

      - name: Sign and notarize (optional; ad-hoc fallback when credentials are absent)
        id: sign
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ inputs.macos-team-id }}
          SIGNING_IDENTITY: ${{ inputs.macos-signing-identity }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          [[ -n "${CERT_P12_BASE64:-}" ]] && echo "::add-mask::${CERT_P12_BASE64}"
          [[ -n "${CERT_PASSWORD:-}" ]] && echo "::add-mask::${CERT_PASSWORD}"
          [[ -n "${APPLE_APP_PASSWORD:-}" ]] && echo "::add-mask::${APPLE_APP_PASSWORD}"

          # Downloaded artifacts are relative to the artifact-glob root (for example a single
          # `App-1.2.3.dmg` or an `App.app/` bundle), so enumerate the top level as-is.
          artifacts=()
          while IFS= read -r entry; do
            [[ -n "$entry" ]] && artifacts+=("$entry")
          done < <(find signed -mindepth 1 -maxdepth 1 -print | LC_ALL=C sort)
          if [[ ${#artifacts[@]} -eq 0 ]]; then
            echo "::error::No artifacts were downloaded for signing."
            exit 1
          fi

          signable=()
          for f in "${artifacts[@]}"; do
            if [[ -d "$f" ]]; then
              case "$f" in
                *.app) signable+=("$f") ;;
                *) echo "::notice::Skipping directory $(basename "$f") (sign the .app bundle before packaging)." ;;
              esac
              continue
            fi
            case "$f" in
              *.dmg) signable+=("$f") ;;
              *)
                if file "$f" 2>/dev/null | grep -q 'Mach-O'; then signable+=("$f"); fi
                ;;
            esac
          done
          if [[ ${#signable[@]} -eq 0 ]]; then
            echo "::warning::No signable .app/.dmg/Mach-O artifact found; signing is skipped. Sign the app bundle before zipping when distribution requires a signature."
          fi

          keychain=""
          cleanup() {
            if [[ -n "$keychain" ]]; then
              security delete-keychain "$keychain" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          signing_mode="skipped"
          notarized="false"

          if [[ -n "${CERT_P12_BASE64:-}" ]]; then
            signing_mode="developer-id"
            keychain="$RUNNER_TEMP/release-signing.keychain-db"
            keychain_password="$(openssl rand -hex 24)"
            echo "::add-mask::${keychain_password}"
            cert_path="$RUNNER_TEMP/release-signing.p12"
            ( umask 077 && printf '%s' "$CERT_P12_BASE64" | base64 -D > "$cert_path" 2>/dev/null || printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$cert_path" )
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 3600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security import "$cert_path" -k "$keychain" -P "${CERT_PASSWORD:-}" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
            rm -f "$cert_path"
            echo "::notice::Signing ${#signable[@]} artifact(s) with a Developer ID certificate."
            for f in "${signable[@]}"; do
              codesign --force --deep --options runtime --timestamp --sign "$SIGNING_IDENTITY" --keychain "$keychain" "$f"
            done
            if [[ ${#signable[@]} -gt 0 ]]; then
              if [[ -n "${APPLE_ID:-}" && -n "${APPLE_APP_PASSWORD:-}" && -n "${TEAM_ID:-}" ]]; then
                for f in "${signable[@]}"; do
                  case "$f" in
                    *.app)
                      notarize_zip="$RUNNER_TEMP/$(basename "$f").zip"
                      ditto -c -k --keepParent "$f" "$notarize_zip"
                      xcrun notarytool submit "$notarize_zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$TEAM_ID" --wait
                      xcrun stapler staple "$f"
                      rm -f "$notarize_zip"
                      ;;
                    *.dmg)
                      xcrun notarytool submit "$f" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$TEAM_ID" --wait
                      xcrun stapler staple "$f"
                      ;;
                    *)
                      echo "::notice::Notarization skipped for $(basename "$f") (notarize .app or .dmg artifacts)."
                      ;;
                  esac
                done
                notarized="true"
              else
                echo "::warning::Developer ID signing succeeded but notarization credentials are absent; artifacts are signed but NOT notarized."
              fi
            fi
          else
            signing_mode="ad-hoc"
            echo "::warning::MACOS_CERT_P12 is not configured; falling back to ad-hoc signing (not notarized). Configure the macOS signing secrets before distributing this release."
            for f in "${signable[@]}"; do
              case "$f" in
                *.app|*.app/*) codesign --force --deep --sign - "$f" ;;
                *) echo "::notice::Ad-hoc signing skipped for $(basename "$f") (ad-hoc codesign applies to app bundles/binaries; review the artifact)." ;;
              esac
            done
          fi

          {
            echo "signing-mode=${signing_mode}"
            echo "notarized=${notarized}"
            echo "signable-count=${#signable[@]}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload signed macOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}-signed
          path: signed/**
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

      - name: Record signed artifact name
        id: record
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: echo "signed-artifact-name=${ARTIFACT_NAME}-signed" >> "$GITHUB_OUTPUT"

  checksum:
    name: checksum
    needs: [prepare, build, sign]
    if: ${{ always() && needs.build.result == 'success' && needs.prepare.outputs.profile != 'container' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      checksums-file: ${{ steps.checksum.outputs.checksums-file }}
      artifact-list: ${{ steps.checksum.outputs.artifact-list }}
    steps:
      - name: Download release artifacts for checksumming
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign.result == 'success' && needs.sign.outputs.signed-artifact-name || inputs.artifact-name }}
          path: release

      - name: Generate and verify checksums
        id: checksum
        env:
          ALGORITHM: ${{ needs.prepare.outputs.checksum-algorithm }}
          CHECKSUMS_FILE: ${{ needs.prepare.outputs.checksums-file }}
        run: |
          set -euo pipefail
          cd release
          case "$ALGORITHM" in
            sha256) hash_cmd=(sha256sum) ;;
            sha512) hash_cmd=(sha512sum) ;;
            *) echo "::error::Unsupported algorithm '${ALGORITHM}'."; exit 1 ;;
          esac
          if ! command -v "${hash_cmd[0]}" >/dev/null 2>&1; then
            echo "::error::${hash_cmd[0]} is not available on this runner."
            exit 1
          fi
          mapfile -t files < <(find . -type f ! -name "$CHECKSUMS_FILE" | LC_ALL=C sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No artifact files to checksum."
            exit 1
          fi
          if [[ -e "$CHECKSUMS_FILE" ]]; then
            echo "::error::Refusing to overwrite an existing ${CHECKSUMS_FILE}."
            exit 1
          fi
          : > "$CHECKSUMS_FILE"
          for f in "${files[@]}"; do
            rel="${f#./}"
            digest="$("${hash_cmd[@]}" "$f" | awk '{print $1}')"
            printf '%s  %s\n' "$digest" "$rel" >> "$CHECKSUMS_FILE"
          done
          echo "::group::${CHECKSUMS_FILE}"
          cat "$CHECKSUMS_FILE"
          echo "::endgroup::"
          "${hash_cmd[@]}" -c "$CHECKSUMS_FILE" >/dev/null
          echo "::notice::Checksums verified (${#files[@]} file(s), ${ALGORITHM})."
          echo "checksums-file=${CHECKSUMS_FILE}" >> "$GITHUB_OUTPUT"
          {
            echo "artifact-list<<__FILES__"
            printf '%s\n' "${files[@]#./}"
            echo "__FILES__"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release checksums (${ALGORITHM})"
            echo ""
            echo "| File | ${ALGORITHM^^} |"
            echo "|---|---|"
            while read -r digest rel; do
              echo "| \`${rel}\` | \`${digest}\` |"
            done < "$CHECKSUMS_FILE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release bundle (artifacts + checksums)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: release/**
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  release:
    name: publish-github-release
    needs: [prepare, checksum]
    if: ${{ always() && needs.prepare.outputs.should-publish == 'true' && needs.checksum.result == 'success' && (needs.prepare.outputs.profile == 'generic' || needs.prepare.outputs.profile == 'macos') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    outputs:
      release-url: ${{ steps.create.outputs.release-url }}
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release

      - name: Verify checksums before publishing
        env:
          CHECKSUMS_FILE: ${{ needs.prepare.outputs.checksums-file }}
        run: |
          set -euo pipefail
          cd release
          case "$CHECKSUMS_FILE" in
            SHA256SUMS) sha256sum -c "$CHECKSUMS_FILE" ;;
            SHA512SUMS) sha512sum -c "$CHECKSUMS_FILE" ;;
            *) echo "::error::Unexpected checksum file '${CHECKSUMS_FILE}'."; exit 1 ;;
          esac

      - name: Create GitHub Release and upload assets
        id: create
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release-name }}
          DRAFT_INPUT: ${{ inputs.draft }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "pull_request_target" ]]; then
            echo "::error::Publishing is never allowed from pull_request events."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists. Releases are immutable by policy; create a new version instead of overwriting."
            exit 1
          fi
          args=(release create "$TAG" release/* --verify-tag --title "$RELEASE_NAME" --generate-notes)
          if [[ "$DRAFT_INPUT" == "true" ]]; then args+=(--draft); fi
          if [[ "$PRERELEASE_INPUT" == "true" ]]; then args+=(--prerelease); fi
          echo "::group::gh ${args[*]}"
          gh "${args[@]}"
          echo "::endgroup::"
          url="$(gh release view "$TAG" --json url --jq .url)"
          echo "::notice::GitHub Release: ${url}"
          echo "release-url=${url}" >> "$GITHUB_OUTPUT"

      - name: Write publish summary
        env:
          RELEASE_URL: ${{ steps.create.outputs.release-url }}
          DRAFT_INPUT: ${{ inputs.draft }}
        run: |
          {
            echo "## Published GitHub Release"
            echo ""
            echo "- URL: ${RELEASE_URL}"
            echo "- Draft: \`${DRAFT_INPUT}\` (a human publishes drafts after review)"
          } >> "$GITHUB_STEP_SUMMARY"

  container-publish:
    name: publish-container
    needs: [prepare, build]
    if: ${{ always() && needs.prepare.outputs.profile == 'container' && needs.prepare.outputs.should-publish == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.push.outputs.image-digest }}
    steps:
      - name: Download container image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: container

      - name: Load, tag, and push to GHCR
        id: push
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          IMAGE_NAME: ${{ needs.prepare.outputs.image-name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "pull_request_target" ]]; then
            echo "::error::Publishing is never allowed from pull_request events."
            exit 1
          fi
          tar_path="$(find container -maxdepth 1 -name 'image-*.tar' -print -quit)"
          if [[ -z "$tar_path" ]]; then
            echo "::error::No container image tar found in the build artifact."
            exit 1
          fi
          metadata="$(find container -maxdepth 1 -name 'container-metadata.json' -print -quit)"
          if [[ -z "$metadata" ]]; then
            echo "::error::container-metadata.json missing from the build artifact."
            exit 1
          fi
          local_image="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["image"])' "$metadata")"
          if [[ -z "$local_image" ]]; then
            echo "::error::Could not read the local image reference from container-metadata.json."
            exit 1
          fi
          docker load -i "$tar_path"
          echo "::add-mask::${GH_TOKEN}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          short_sha="${SHA:0:12}"
          for ref in "${IMAGE_NAME}:${VERSION}" "${IMAGE_NAME}:sha-${short_sha}"; do
            docker tag "$local_image" "$ref"
            docker push "$ref"
          done
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE_NAME}:${VERSION}")"
          echo "::notice::Pushed ${IMAGE_NAME} tags ${VERSION} and sha-${short_sha}: ${digest}"
          echo "image-digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "## Published container image"
            echo ""
            echo "- Image: \`${IMAGE_NAME}\`"
            echo "- Tags: \`${VERSION}\`, \`sha-${short_sha}\`"
            echo "- Digest: \`${digest}\`"
            echo ""
            echo "Optional SBOM/provenance: use buildx with \`--sbom=true --provenance=mode=max\` when a project requires attestations; this template ships the guarded push path only."
          } >> "$GITHUB_STEP_SUMMARY"

  package-publish:
    name: publish-package
    needs: [prepare, build, checksum]
    if: ${{ always() && needs.prepare.outputs.profile == 'package' && needs.prepare.outputs.should-publish == 'true' && needs.checksum.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release

      - name: Detect publish auth mode
        id: auth
        env:
          NPM_TOKEN_PRESENT: ${{ secrets.NPM_TOKEN != '' }}
          PYPI_TOKEN_PRESENT: ${{ secrets.PYPI_API_TOKEN != '' }}
        run: |
          set -euo pipefail
          echo "has-npm-token=${NPM_TOKEN_PRESENT:-false}" >> "$GITHUB_OUTPUT"
          echo "has-pypi-token=${PYPI_TOKEN_PRESENT:-false}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: Publish to npm (trusted publishing/OIDC preferred)
        if: ${{ contains(needs.build.outputs.package-kinds, 'npm') }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          HAS_NPM_TOKEN: ${{ steps.auth.outputs.has-npm-token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(release/*.tgz)
          if [[ ${#tarballs[@]} -eq 0 ]]; then
            echo "::error::npm publish selected but no .tgz tarball is in the release bundle."
            exit 1
          fi
          if [[ "${HAS_NPM_TOKEN}" == "true" ]]; then
            echo "::add-mask::${NPM_TOKEN}"
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
            echo "::notice::Publishing with the NPM_TOKEN secret (static-token exception; document rotation in the tracker)."
          else
            echo "::notice::Publishing with npm trusted publishing (OIDC). The package must be configured on npmjs.com for this repository/workflow/environment."
          fi
          npm publish "${tarballs[@]}" --provenance --access public

      - name: Publish to PyPI with OIDC trusted publishing
        if: ${{ contains(needs.build.outputs.package-kinds, 'pypi') && steps.auth.outputs.has-pypi-token == 'false' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release/
          print-hash: true
          skip-existing: true
          attestations: true

      - name: Publish to PyPI with a static token (fallback)
        if: ${{ contains(needs.build.outputs.package-kinds, 'pypi') && steps.auth.outputs.has-pypi-token == 'true' }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${PYPI_API_TOKEN}"
          shopt -s nullglob
          dists=(release/*.whl release/*.tar.gz)
          if [[ ${#dists[@]} -eq 0 ]]; then
            echo "::error::PyPI publish selected but no wheel/sdist is in the release bundle."
            exit 1
          fi
          python -m pip install --quiet --disable-pip-version-check twine
          TWINE_USERNAME='__token__' TWINE_PASSWORD="$PYPI_API_TOKEN" \
            twine upload --non-interactive "${dists[@]}"

      - name: Write package summary
        env:
          PACKAGE_KINDS: ${{ needs.build.outputs.package-kinds }}
          HAS_NPM_TOKEN: ${{ steps.auth.outputs.has-npm-token }}
          HAS_PYPI_TOKEN: ${{ steps.auth.outputs.has-pypi-token }}
        run: |
          {
            echo "## Package publish"
            echo ""
            echo "- Registries: \`${PACKAGE_KINDS}\`"
            echo "- npm auth: \`$([[ "$HAS_NPM_TOKEN" == "true" ]] && echo static-token || echo OIDC-trusted-publishing)\`"
            echo "- PyPI auth: \`$([[ "$HAS_PYPI_TOKEN" == "true" ]] && echo static-token || echo OIDC-trusted-publishing)\`"
            echo ""
            echo "Static-token exceptions must be documented, scoped, and rotated in the project tracker."
          } >> "$GITHUB_STEP_SUMMARY"
