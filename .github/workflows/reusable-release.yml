# Reusable release pipelines for Project Tracker OS adopters (T10 release profile).
#
# Contract source of truth: docs/ACTIONS_CATALOG.md §7.5 (interface), §2.4 (catalog entry),
# §9 (guards). This workflow delivers that contract; docs/RELEASE_PROFILES.md documents the
# delivered inputs/outputs/secrets/permissions and every profile in detail.
#
# Safety model (non-negotiable):
# - dry-run is the default; it builds, checksums, and validates without publishing anything.
# - publishing requires a `v*` tag ref matching `tag-pattern` (or a workflow_dispatch run that
#   selected a release tag ref) AND `publish: true` AND `dry-run: false`, and it always runs in
#   the protected `release` environment (required reviewers are configured in the adopting repo).
# - no `pull_request` trigger exists here and every publish job also asserts the event is not a
#   pull request; fork PRs can never reach a publish path.
# - no secrets are printed; signing/publishing secrets are optional and empty means
#   "skip cleanly" (the macOS profile falls back to ad-hoc signing with an explicit warning,
#   never a silent unsigned publish).
# - checksums are generated after signing, verified in the release job, and shipped as
#   `SHA256SUMS` (or `SHA512SUMS` for the sha512 algorithm).
# - third-party actions are pinned by full commit SHA. A reusable workflow cannot rely on local
#   composite actions from this repository when called cross-repo (the `./` action path resolves
#   against the caller checkout), so the checksum/signing logic is inlined here for reusable
#   mode. The `checksum` and `sign-notarize-macos` composite actions are the copy-mode/local
#   contract (see profiles/release/** and docs/RELEASE_PROFILES.md).
name: Reusable Release

on:
  workflow_call:
    inputs:
      profile:
        description: >-
          Release profile: generic (GitHub Release assets), macos (dmg/zip with optional
          signing/notarization), container (GHCR image), package (npm/PyPI). Aliases documented
          in docs/RELEASE_PROFILES.md.
        type: string
        required: false
        default: generic
      version:
        description: >-
          Version to release (for example v1.0.0 or 1.0.0). Empty derives it from the tag ref;
          a dry-run dispatch may omit it and uses 0.0.0-dryrun.
        type: string
        required: false
        default: ''
      tag-pattern:
        description: >-
          POSIX extended regex a release tag must match. `\d` is accepted as shorthand for
          `[0-9]`. The tag must be `v` + the resolved version.
        type: string
        required: false
        default: '^v[0-9]+\.[0-9]+\.[0-9]+$'
      dry-run:
        description: >-
          Build, validate, and checksum only; never create a release or publish. Default true.
        type: boolean
        required: false
        default: true
      publish:
        description: >-
          Request publishing. Honored only with a matching tag ref, `dry-run: false`, and the
          protected `release` environment. Default false.
        type: boolean
        required: false
        default: false
      artifact-globs:
        description: >-
          Newline-separated globs (for example dist/**) uploaded as the release artifacts,
          relative to the repository root. Must match at least one file (fail closed).
        type: string
        required: false
        default: 'dist/**'
      checksum-algorithm:
        description: 'Checksum algorithm: sha256 (default) or sha512.'
        type: string
        required: false
        default: sha256
      build-command:
        description: >-
          Shell command run from working-directory to produce the release artifacts. Empty uses
          the profile default (container: docker build; package: npm pack or python -m build;
          generic/macos: expect artifacts to already exist).
        type: string
        required: false
        default: ''
      working-directory:
        description: 'Directory the build command runs in, relative to the repository root.'
        type: string
        required: false
        default: '.'
      node-version:
        description: 'Node.js version for Node-based builds/publishing. Empty skips Node setup.'
        type: string
        required: false
        default: '22'
      macos-runner:
        description: 'macOS runner label used by the macos profile.'
        type: string
        required: false
        default: macos-14
      macos-team-id:
        description: 'Apple Developer team ID used for signing/notarization (non-secret; required to notarize).'
        type: string
        required: false
        default: ''
      macos-signing-identity:
        description: 'codesign identity used for Developer ID signing.'
        type: string
        required: false
        default: 'Developer ID Application'
      image-name:
        description: >-
          Container image repository for the container profile (no tag). Empty defaults to
          ghcr.io/<owner>/<repo> (lowercase).
        type: string
        required: false
        default: ''
      package-registries:
        description: >-
          Optional package registry override for the package profile. Empty auto-detects from
          the build output (npm tarball and/or PyPI wheel/sdist); values are comma-separated
          `npm` and/or `pypi`.
        type: string
        required: false
        default: ''
      artifact-name:
        description: 'Base name for uploaded workflow artifacts.'
        type: string
        required: false
        default: release-artifacts
      retention-days:
        description: 'Retention in days for uploaded artifacts.'
        type: number
        required: false
        default: 30
      release-name:
        description: 'GitHub Release title. Empty defaults to the validated tag.'
        type: string
        required: false
        default: ''
      draft:
        description: 'Create the GitHub Release as a draft (default true; a human publishes it).'
        type: boolean
        required: false
        default: true
      prerelease:
        description: 'Mark the GitHub Release as a prerelease.'
        type: boolean
        required: false
        default: false
    outputs:
      version:
        description: 'Validated semantic version (without leading v).'
        value: ${{ jobs.prepare.outputs.version }}
      artifacts:
        description: 'Newline-separated artifact file list relative to the release bundle root.'
        value: ${{ jobs.checksum.outputs.artifact-list }}
      checksums-file:
        description: 'Checksum file name (SHA256SUMS or SHA512SUMS).'
        value: ${{ jobs.checksum.outputs.checksums-file }}
      release-url:
        description: 'Created GitHub Release URL; empty on dry-run.'
        value: ${{ jobs.release.outputs.release-url }}
      dry-run:
        description: "'true' when the run did not publish."
        value: ${{ jobs.prepare.outputs.dry-run }}
    secrets:
      RELEASE_TOKEN:
        description: >-
          Optional token used instead of github.token for publishing (only when org policy
          forbids the default token). Never required for dry-runs.
        required: false
      MACOS_CERT_P12:
        description: 'Optional base64 Developer ID Application certificate (.p12) for macOS signing.'
        required: false
      MACOS_CERT_PASSWORD:
        description: 'Optional password for MACOS_CERT_P12.'
        required: false
      APPLE_ID:
        description: 'Optional Apple ID for notarization (notarytool).'
        required: false
      APPLE_APP_PASSWORD:
        description: 'Optional app-specific password for notarization.'
        required: false
      NPM_TOKEN:
        description: >-
          Optional npm automation token. Preferred path is npm trusted publishing (OIDC) with
          `id-token: write`; pass this only when OIDC is unavailable.
        required: false
      PYPI_API_TOKEN:
        description: >-
          Optional PyPI API token. Preferred path is PyPI trusted publishing (OIDC); pass this
          only when OIDC is unavailable.
        required: false

# Least privilege: start with nothing and grant per job.

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: 0.0.0-stub
      dry-run: 'true'
    steps:
      - run: echo prepare
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: stub
      package-kinds: stub
    steps:
      - run: echo build
  sign:
    runs-on: ubuntu-latest
    steps:
      - run: echo sign
  checksum:
    name: checksum
    needs: [prepare, build, sign]
    if: ${{ always() && needs.build.result == 'success' && needs.prepare.outputs.profile != 'container' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      checksums-file: ${{ steps.checksum.outputs.checksums-file }}
      artifact-list: ${{ steps.checksum.outputs.artifact-list }}
    steps:
      - name: Download release artifacts for checksumming
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign.result == 'success' && needs.sign.outputs.signed-artifact-name || inputs.artifact-name }}
          path: release

      - name: Generate and verify checksums
        id: checksum
        env:
          ALGORITHM: ${{ needs.prepare.outputs.checksum-algorithm }}
          CHECKSUMS_FILE: ${{ needs.prepare.outputs.checksums-file }}
        run: |
          set -euo pipefail
          cd release
          case "$ALGORITHM" in
            sha256) hash_cmd=(sha256sum) ;;
            sha512) hash_cmd=(sha512sum) ;;
            *) echo "::error::Unsupported algorithm '${ALGORITHM}'."; exit 1 ;;
          esac
          if ! command -v "${hash_cmd[0]}" >/dev/null 2>&1; then
            echo "::error::${hash_cmd[0]} is not available on this runner."
            exit 1
          fi
          mapfile -t files < <(find . -type f ! -name "$CHECKSUMS_FILE" | LC_ALL=C sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No artifact files to checksum."
            exit 1
          fi
          if [[ -e "$CHECKSUMS_FILE" ]]; then
            echo "::error::Refusing to overwrite an existing ${CHECKSUMS_FILE}."
            exit 1
          fi
          : > "$CHECKSUMS_FILE"
          for f in "${files[@]}"; do
            rel="${f#./}"
            digest="$("${hash_cmd[@]}" "$f" | awk '{print $1}')"
            printf '%s  %s\n' "$digest" "$rel" >> "$CHECKSUMS_FILE"
          done
          echo "::group::${CHECKSUMS_FILE}"
          cat "$CHECKSUMS_FILE"
          echo "::endgroup::"
          "${hash_cmd[@]}" -c "$CHECKSUMS_FILE" >/dev/null
          echo "::notice::Checksums verified (${#files[@]} file(s), ${ALGORITHM})."
          echo "checksums-file=${CHECKSUMS_FILE}" >> "$GITHUB_OUTPUT"
          {
            echo "artifact-list<<__FILES__"
            printf '%s\n' "${files[@]#./}"
            echo "__FILES__"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release checksums (${ALGORITHM})"
            echo ""
            echo "| File | ${ALGORITHM^^} |"
            echo "|---|---|"
            while read -r digest rel; do
              echo "| \`${rel}\` | \`${digest}\` |"
            done < "$CHECKSUMS_FILE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release bundle (artifacts + checksums)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: release/**
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  release:
    name: publish-github-release
    needs: [prepare, checksum]
    if: ${{ always() && needs.prepare.outputs.should-publish == 'true' && needs.checksum.result == 'success' && (needs.prepare.outputs.profile == 'generic' || needs.prepare.outputs.profile == 'macos') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    outputs:
      release-url: ${{ steps.create.outputs.release-url }}
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release

      - name: Verify checksums before publishing
        env:
          CHECKSUMS_FILE: ${{ needs.prepare.outputs.checksums-file }}
        run: |
          set -euo pipefail
          cd release
          case "$CHECKSUMS_FILE" in
            SHA256SUMS) sha256sum -c "$CHECKSUMS_FILE" ;;
            SHA512SUMS) sha512sum -c "$CHECKSUMS_FILE" ;;
            *) echo "::error::Unexpected checksum file '${CHECKSUMS_FILE}'."; exit 1 ;;
          esac

      - name: Create GitHub Release and upload assets
        id: create
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release-name }}
          DRAFT_INPUT: ${{ inputs.draft }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "pull_request_target" ]]; then
            echo "::error::Publishing is never allowed from pull_request events."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists. Releases are immutable by policy; create a new version instead of overwriting."
            exit 1
          fi
          args=(release create "$TAG" release/* --verify-tag --title "$RELEASE_NAME" --generate-notes)
          if [[ "$DRAFT_INPUT" == "true" ]]; then args+=(--draft); fi
          if [[ "$PRERELEASE_INPUT" == "true" ]]; then args+=(--prerelease); fi
          echo "::group::gh ${args[*]}"
          gh "${args[@]}"
          echo "::endgroup::"
          url="$(gh release view "$TAG" --json url --jq .url)"
          echo "::notice::GitHub Release: ${url}"
          echo "release-url=${url}" >> "$GITHUB_OUTPUT"

      - name: Write publish summary
        env:
          RELEASE_URL: ${{ steps.create.outputs.release-url }}
          DRAFT_INPUT: ${{ inputs.draft }}
        run: |
          {
            echo "## Published GitHub Release"
            echo ""
            echo "- URL: ${RELEASE_URL}"
            echo "- Draft: \`${DRAFT_INPUT}\` (a human publishes drafts after review)"
          } >> "$GITHUB_STEP_SUMMARY"

  container-publish:
    name: publish-container
    needs: [prepare, build]
    if: ${{ always() && needs.prepare.outputs.profile == 'container' && needs.prepare.outputs.should-publish == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.push.outputs.image-digest }}
    steps:
      - name: Download container image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: container

      - name: Load, tag, and push to GHCR
        id: push
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          IMAGE_NAME: ${{ needs.prepare.outputs.image-name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "pull_request_target" ]]; then
            echo "::error::Publishing is never allowed from pull_request events."
            exit 1
          fi
          tar_path="$(find container -maxdepth 1 -name 'image-*.tar' -print -quit)"
          if [[ -z "$tar_path" ]]; then
            echo "::error::No container image tar found in the build artifact."
            exit 1
          fi
          metadata="$(find container -maxdepth 1 -name 'container-metadata.json' -print -quit)"
          if [[ -z "$metadata" ]]; then
            echo "::error::container-metadata.json missing from the build artifact."
            exit 1
          fi
          local_image="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["image"])' "$metadata")"
          if [[ -z "$local_image" ]]; then
            echo "::error::Could not read the local image reference from container-metadata.json."
            exit 1
          fi
          docker load -i "$tar_path"
          echo "::add-mask::${GH_TOKEN}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          short_sha="${SHA:0:12}"
          for ref in "${IMAGE_NAME}:${VERSION}" "${IMAGE_NAME}:sha-${short_sha}"; do
            docker tag "$local_image" "$ref"
            docker push "$ref"
          done
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE_NAME}:${VERSION}")"
          echo "::notice::Pushed ${IMAGE_NAME} tags ${VERSION} and sha-${short_sha}: ${digest}"
          echo "image-digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "## Published container image"
            echo ""
            echo "- Image: \`${IMAGE_NAME}\`"
            echo "- Tags: \`${VERSION}\`, \`sha-${short_sha}\`"
            echo "- Digest: \`${digest}\`"
            echo ""
            echo "Optional SBOM/provenance: use buildx with \`--sbom=true --provenance=mode=max\` when a project requires attestations; this template ships the guarded push path only."
          } >> "$GITHUB_STEP_SUMMARY"

  package-publish:
    name: publish-package
    needs: [prepare, build, checksum]
    if: ${{ always() && needs.prepare.outputs.profile == 'package' && needs.prepare.outputs.should-publish == 'true' && needs.checksum.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release

      - name: Detect publish auth mode
        id: auth
        env:
          NPM_TOKEN_PRESENT: ${{ secrets.NPM_TOKEN != '' }}
          PYPI_TOKEN_PRESENT: ${{ secrets.PYPI_API_TOKEN != '' }}
        run: |
          set -euo pipefail
          echo "has-npm-token=${NPM_TOKEN_PRESENT:-false}" >> "$GITHUB_OUTPUT"
          echo "has-pypi-token=${PYPI_TOKEN_PRESENT:-false}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: Publish to npm (trusted publishing/OIDC preferred)
        if: ${{ contains(needs.build.outputs.package-kinds, 'npm') }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          HAS_NPM_TOKEN: ${{ steps.auth.outputs.has-npm-token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(release/*.tgz)
          if [[ ${#tarballs[@]} -eq 0 ]]; then
            echo "::error::npm publish selected but no .tgz tarball is in the release bundle."
            exit 1
          fi
          if [[ "${HAS_NPM_TOKEN}" == "true" ]]; then
            echo "::add-mask::${NPM_TOKEN}"
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
            echo "::notice::Publishing with the NPM_TOKEN secret (static-token exception; document rotation in the tracker)."
          else
            echo "::notice::Publishing with npm trusted publishing (OIDC). The package must be configured on npmjs.com for this repository/workflow/environment."
          fi
          npm publish "${tarballs[@]}" --provenance --access public

      - name: Publish to PyPI with OIDC trusted publishing
        if: ${{ contains(needs.build.outputs.package-kinds, 'pypi') && steps.auth.outputs.has-pypi-token == 'false' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release/
          print-hash: true
          skip-existing: true
          attestations: true

      - name: Publish to PyPI with a static token (fallback)
        if: ${{ contains(needs.build.outputs.package-kinds, 'pypi') && steps.auth.outputs.has-pypi-token == 'true' }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${PYPI_API_TOKEN}"
          shopt -s nullglob
          dists=(release/*.whl release/*.tar.gz)
          if [[ ${#dists[@]} -eq 0 ]]; then
            echo "::error::PyPI publish selected but no wheel/sdist is in the release bundle."
            exit 1
          fi
          python -m pip install --quiet --disable-pip-version-check twine
          TWINE_USERNAME='__token__' TWINE_PASSWORD="$PYPI_API_TOKEN" \
            twine upload --non-interactive "${dists[@]}"

      - name: Write package summary
        env:
          PACKAGE_KINDS: ${{ needs.build.outputs.package-kinds }}
          HAS_NPM_TOKEN: ${{ steps.auth.outputs.has-npm-token }}
          HAS_PYPI_TOKEN: ${{ steps.auth.outputs.has-pypi-token }}
        run: |
          {
            echo "## Package publish"
            echo ""
            echo "- Registries: \`${PACKAGE_KINDS}\`"
            echo "- npm auth: \`$([[ "$HAS_NPM_TOKEN" == "true" ]] && echo static-token || echo OIDC-trusted-publishing)\`"
            echo "- PyPI auth: \`$([[ "$HAS_PYPI_TOKEN" == "true" ]] && echo static-token || echo OIDC-trusted-publishing)\`"
            echo ""
            echo "Static-token exceptions must be documented, scoped, and rotated in the project tracker."
          } >> "$GITHUB_STEP_SUMMARY"
