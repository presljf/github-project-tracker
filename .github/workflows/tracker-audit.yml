name: Tracker audit (advisory)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Run advisory tracker audit
        env:
          GH_TOKEN: ${{ secrets.TRACKER_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "TRACKER_TOKEN is not configured; skipping advisory audit."
            exit 0
          fi
          node scripts/github/audit.mjs --config tracker.config.json --advisory
