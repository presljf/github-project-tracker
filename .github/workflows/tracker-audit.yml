name: Tracker audit (advisory)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run advisory tracker audit
        env:
          GH_TOKEN: ${{ secrets.TRACKER_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "TRACKER_TOKEN is not configured; skipping advisory audit."
            exit 0
          fi
          node scripts/adopt/cli/audit.mjs --config tracker.config.json --advisory
