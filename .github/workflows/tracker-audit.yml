# Thin self caller for reusable-audit.yml (dogfooding the adopter contract).
# Check context: `tracker-audit / audit`.
#
# Advisory by default: PRs give live advisory evidence without blocking; schedule/dispatch keep the
# weekly baseline. Advisory mode with no TRACKER_TOKEN skips cleanly inside the reusable workflow.
# `tracker-ref: ''` is self mode — the audit script comes from this checkout.
name: Tracker audit (advisory)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 1'
  pull_request:

permissions:
  contents: read

concurrency:
  group: tracker-audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tracker-audit:
    name: tracker-audit
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-audit.yml
    with:
      tracker-ref: ''
      config-path: tracker.config.json
      mode: advisory
      json: true
    secrets:
      TRACKER_TOKEN: ${{ secrets.TRACKER_TOKEN }}
