# Thin generic GitHub Release caller (T10 release profile, template repository).
#
# Reusable workflow: ./.github/workflows/reusable-release.yml (contract in
# docs/ACTIONS_CATALOG.md §7.5; profile details in docs/RELEASE_PROFILES.md).
#
# Profile: generic — build release artifacts, checksum them, and attach them to a GitHub Release.
# - Tag push (`v*`): validates tag == version, builds, checksums, and creates a DRAFT release by
#   default. Publishing to the public release list is a deliberate human step after review.
# - workflow_dispatch: dry-run by default. `publish: true` is honored only when the dispatch ref
#   is the release tag and `dry-run` is false; both are still gated by the protected `release`
#   environment (configure required reviewers before relying on publish).
#
# Adopters: for the macOS/container/package profiles, copy the matching caller example from
# profiles/release/reusable/ into .github/workflows/ and pin the template ref to the tag you
# adopted (replace @v1.4.0 in the copied file). For the generic profile, copy this caller and keep
# .github/workflows/reusable-release.yml in sync (or call the template by pinned ref — see
# docs/RELEASE_PROFILES.md), and replace the build-command with your project's real build.
# GitHub executes only .github/workflows/, so profiles/ examples never run in place.
# Never publish from a pull_request event; this workflow has no PR trigger.
name: Release (generic)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to validate (for example v1.0.0). Empty uses the tag ref, or 0.0.0-dryrun on a dry-run dispatch.'
        required: false
        type: string
        default: ''
      dry-run:
        description: 'Build and validate only; never create or publish a release (default).'
        required: false
        type: boolean
        default: true
      publish:
        description: 'Request publishing. Honored only when dispatching on a release tag ref with dry-run disabled.'
        required: false
        type: boolean
        default: false
      contract-gate:
        description: >-
          Opt in to the adoption-contract gate (verify-tooling + verify-contract + offline
          release-gate) before build. Default false; the open-OI check stays a release-procedure step.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    # GitHub requires the caller job to grant at least the union of permissions declared by the
    # called reusable workflow's jobs: contents: write (release job), packages: write (container
    # job), id-token: write (package OIDC publishing). Profile jobs that do not apply are skipped
    # and never use the extra grant; each called job still declares its own reduced permission set.
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-release.yml
    with:
      profile: generic
      version: ${{ inputs.version }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
      publish: ${{ github.event_name == 'push' || inputs.publish }}
      # Opt-in contract gate (v1.4.0). `tracker-ref` is ignored in this repository's self mode; an
      # adopter copying this caller must set the exact adopted release tag (v1.4.0+; empty would
      # make actions/checkout use the tracker default branch) and keep the caller grant at
      # contents/packages/id-token write.
      contract-gate: ${{ github.event_name == 'workflow_dispatch' && inputs.contract-gate || false }}
      tracker-ref: v1.4.0
      # Template release artifact: deterministic source archive + manifest. Replace with the
      # adopting project's real build command.
      build-command: |
        set -euo pipefail
        mkdir -p dist
        prefix="github-project-tracker-${VERSION}"
        git archive --format=tar.gz --prefix="${prefix}/" -o "dist/${prefix}.tar.gz" HEAD
        node -e 'const fs = require("node:fs"); fs.writeFileSync("dist/release-manifest.json", JSON.stringify({ version: process.env.VERSION, commit: process.env.GITHUB_SHA }, null, 2) + "\n");'
      artifact-globs: |
        dist/*.tar.gz
        dist/release-manifest.json
      node-version: '22'
      checksum-algorithm: sha256
