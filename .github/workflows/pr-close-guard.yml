# Thin self caller for reusable-pr-close-guard.yml (dogfooding the adopter contract).
# Check context: `pr-close-guard / guard`.
#
# The guard script is read-only, so this caller grants only contents/issues/pull-requests read
# (no issues: write). `tracker-ref: ''` is self mode — the script comes from this checkout.
name: PR close guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-close-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-close-guard:
    name: pr-close-guard
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/reusable-pr-close-guard.yml
    with:
      tracker-ref: ''
