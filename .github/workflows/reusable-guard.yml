name: Reusable tracker guard

on:
  workflow_call:
    inputs:
      tracker-ref:
        description: Exact template tag/SHA to load the guard from.
        required: false
        type: string
        default: v1.2.2
      config-path:
        description: Project tracker config path (for allowlist).
        required: false
        type: string
        default: tracker.config.json

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Checkout tracker guard
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: presljf/github-project-tracker
          ref: ${{ inputs.tracker-ref }}
          path: .tracker-guard
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Guard GitHub transport
        run: node .tracker-guard/scripts/github/guard-gh-transport.mjs --root .
      - name: Guard docs coverage
        env:
          DOCS_GUARD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .tracker-guard/scripts/docs/guard-docs.mjs --root . --base "${DOCS_GUARD_BASE:-origin/main}"
