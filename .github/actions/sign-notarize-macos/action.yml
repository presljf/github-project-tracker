# Composite macOS sign/notarize action (T10 release profile).
#
# Contract: docs/ACTIONS_CATALOG.md §7.8 `sign-notarize-macos`; docs/RELEASE_PROFILES.md.
# - runs only on a macOS runner (the caller selects `runs-on: macos-*`);
# - guard contract: call only from the tag/dispatch release job inside the protected `release`
#   environment, e.g. `if: inputs.dry-run == false && inputs.certificate-p12 != ''`;
# - no secrets are printed; secret-derived values are masked; nothing is written to the repo;
# - empty secret inputs (no certificate) mean "skip signing cleanly" (outputs report the skip);
# - dry-run mode never contacts Apple and never performs a notarization submission;
# - failures fail the step: a broken signature/notarization is never reported as success.
#
# Required secrets are passed by the caller as inputs (composite actions cannot declare secrets):
#   certificate-p12, certificate-password, apple-id, apple-app-password.
name: Sign and notarize macOS artifacts
description: >-
  codesign, notarytool submit --wait, and stapler staple for macOS release artifacts, with a
  clean skip when credentials are absent and a no-network dry-run mode.

inputs:
  artifact-path:
    description: 'Path to the artifact to sign (a .app bundle, .dmg, or Mach-O binary).'
    required: true
  signing-identity:
    description: 'codesign identity to use.'
    required: false
    default: 'Developer ID Application'
  team-id:
    description: 'Apple Developer team ID used for notarization.'
    required: false
    default: ''
  notarize:
    description: 'Submit for notarization and staple when credentials are present (boolean).'
    required: false
    default: 'false'
  dry-run:
    description: 'Validate inputs and skip signing/notarization entirely (boolean, default true).'
    required: false
    default: 'true'
  keychain-profile:
    description: >-
      Optional keychain profile name for notarytool (when the certificate/keychain was
      provisioned out-of-band). Empty uses apple-id/apple-app-password/team-id.
    required: false
    default: ''
  certificate-p12:
    description: 'Base64-encoded .p12 Developer ID certificate. Empty skips signing cleanly.'
    required: false
    default: ''
  certificate-password:
    description: 'Password for certificate-p12.'
    required: false
    default: ''
  apple-id:
    description: 'Apple ID for notarytool. Empty skips notarization.'
    required: false
    default: ''
  apple-app-password:
    description: 'App-specific password for notarytool.'
    required: false
    default: ''

outputs:
  signed-path:
    description: 'Signed artifact path; empty when signing was skipped.'
    value: ${{ steps.record.outputs.signed-path }}
  notarized:
    description: "'true' when notarization and stapling succeeded; otherwise 'false'."
    value: ${{ steps.record.outputs.notarized }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      id: validate
      shell: bash
      env:
        ARTIFACT_PATH_INPUT: ${{ inputs.artifact-path }}
        NOTARIZE_INPUT: ${{ inputs.notarize }}
        DRY_RUN_INPUT: ${{ inputs.dry-run }}
        CERT_INPUT: ${{ inputs.certificate-p12 }}
      run: |
        set -euo pipefail
        fail() { echo "::error::$*"; exit 1; }

        artifact_path="${ARTIFACT_PATH_INPUT:-}"
        [[ -n "$artifact_path" ]] || fail "artifact-path is required."
        [[ -e "$artifact_path" ]] || fail "artifact-path '${artifact_path}' does not exist."

        dry_run="$(printf '%s' "${DRY_RUN_INPUT:-true}" | tr '[:upper:]' '[:lower:]')"
        notarize="$(printf '%s' "${NOTARIZE_INPUT:-false}" | tr '[:upper:]' '[:lower:]')"
        case "$dry_run" in true|false) ;; *) fail "dry-run must be a boolean." ;; esac
        case "$notarize" in true|false) ;; *) fail "notarize must be a boolean." ;; esac

        should_sign="true"
        if [[ "$dry_run" == "true" ]]; then
          should_sign="false"
          echo "::notice::dry-run: skipping macOS signing/notarization for ${artifact_path}."
        elif [[ -z "${CERT_INPUT:-}" ]]; then
          should_sign="false"
          echo "::notice::No certificate-p12 supplied; skipping macOS signing/notarization cleanly (the calling profile decides whether an ad-hoc fallback is acceptable)."
        fi

        echo "artifact-path=${artifact_path}" >> "$GITHUB_OUTPUT"
        echo "should-sign=${should_sign}" >> "$GITHUB_OUTPUT"
        echo "notarize=${notarize}" >> "$GITHUB_OUTPUT"

    - name: Sign and notarize
      id: sign
      if: ${{ steps.validate.outputs.should-sign == 'true' }}
      shell: bash
      env:
        ARTIFACT_PATH: ${{ steps.validate.outputs.artifact-path }}
        SIGNING_IDENTITY: ${{ inputs.signing-identity }}
        TEAM_ID: ${{ inputs.team-id }}
        NOTARIZE: ${{ steps.validate.outputs.notarize }}
        KEYCHAIN_PROFILE: ${{ inputs.keychain-profile }}
        CERT_P12_BASE64: ${{ inputs.certificate-p12 }}
        CERT_PASSWORD: ${{ inputs.certificate-password }}
        APPLE_ID: ${{ inputs.apple-id }}
        APPLE_APP_PASSWORD: ${{ inputs.apple-app-password }}
      run: |
        set -euo pipefail
        fail() { echo "::error::$*"; exit 1; }

        [[ "$SIGNING_IDENTITY" != "-" ]] || fail "signing-identity '-' (ad-hoc) is not handled by this action; omit the certificate instead to skip signing, or sign ad-hoc in the caller."

        [[ -n "${CERT_P12_BASE64:-}" ]] && echo "::add-mask::${CERT_P12_BASE64}"
        [[ -n "${CERT_PASSWORD:-}" ]] && echo "::add-mask::${CERT_PASSWORD}"
        [[ -n "${APPLE_APP_PASSWORD:-}" ]] && echo "::add-mask::${APPLE_APP_PASSWORD}"

        work_dir="${RUNNER_TEMP:-/tmp}"
        keychain="$work_dir/release-signing.keychain-db"
        keychain_password="$(openssl rand -hex 24)"
        echo "::add-mask::${keychain_password}"
        cert_path="$work_dir/release-signing.p12"
        notarized="false"

        cleanup() {
          security delete-keychain "$keychain" >/dev/null 2>&1 || true
          rm -f "$cert_path"
        }
        trap cleanup EXIT

        ( umask 077 && printf '%s' "$CERT_P12_BASE64" | base64 -D > "$cert_path" 2>/dev/null ) ||
          ( umask 077 && printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$cert_path" ) ||
          fail "certificate-p12 is not valid base64."

        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 3600 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        security import "$cert_path" -k "$keychain" -P "${CERT_PASSWORD:-}" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null

        echo "::notice::Signing ${ARTIFACT_PATH} (identity: ${SIGNING_IDENTITY})."
        if [[ -d "$ARTIFACT_PATH" ]]; then
          codesign --force --deep --options runtime --timestamp --sign "$SIGNING_IDENTITY" --keychain "$keychain" "$ARTIFACT_PATH"
          codesign --verify --deep --strict --verbose=2 "$ARTIFACT_PATH"
        else
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" --keychain "$keychain" "$ARTIFACT_PATH"
          codesign --verify --verbose=2 "$ARTIFACT_PATH"
        fi

        if [[ "$NOTARIZE" == "true" ]]; then
          submit_path="$ARTIFACT_PATH"
          case "$ARTIFACT_PATH" in
            *.app)
              submit_path="$work_dir/notarize.zip"
              ditto -c -k --keepParent "$ARTIFACT_PATH" "$submit_path"
              ;;
            *.dmg) ;;
            *) echo "::notice::Notarization skipped for $(basename "$ARTIFACT_PATH") (notarize .app or .dmg artifacts)." ;;
          esac
          if [[ "$submit_path" == "$ARTIFACT_PATH" && "$ARTIFACT_PATH" != *.dmg ]]; then
            : # notice already emitted above
          else
            if [[ -n "${KEYCHAIN_PROFILE:-}" ]]; then
              xcrun notarytool submit "$submit_path" --keychain-profile "$KEYCHAIN_PROFILE" --wait
            else
              [[ -n "${APPLE_ID:-}" ]] || fail "notarize=true needs apple-id (or keychain-profile) configured."
              [[ -n "${APPLE_APP_PASSWORD:-}" ]] || fail "notarize=true needs apple-app-password configured."
              [[ -n "${TEAM_ID:-}" ]] || fail "notarize=true needs team-id configured."
              xcrun notarytool submit "$submit_path" \
                --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$TEAM_ID" --wait
            fi
            xcrun stapler staple "$ARTIFACT_PATH"
            notarized="true"
            echo "::notice::Notarization accepted and stapled for ${ARTIFACT_PATH}."
          fi
          [[ "$submit_path" == "$ARTIFACT_PATH" ]] || rm -f "$submit_path"
        else
          echo "::notice::Signing only (notarize=false)."
        fi

        echo "signed-path=${ARTIFACT_PATH}" >> "$GITHUB_OUTPUT"
        echo "notarized=${notarized}" >> "$GITHUB_OUTPUT"

    - name: Record results
      id: record
      shell: bash
      env:
        SHOULD_SIGN: ${{ steps.validate.outputs.should-sign }}
        ARTIFACT_PATH: ${{ steps.validate.outputs.artifact-path }}
        SIGNED_PATH: ${{ steps.sign.outputs.signed-path }}
        NOTARIZED: ${{ steps.sign.outputs.notarized }}
      run: |
        set -euo pipefail
        if [[ "${SHOULD_SIGN}" != "true" ]]; then
          echo "::notice::Signing skipped by design (dry-run or no credentials); reported as skipped."
          echo "signed-path=" >> "$GITHUB_OUTPUT"
          echo "notarized=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "signed-path=${SIGNED_PATH:-$ARTIFACT_PATH}" >> "$GITHUB_OUTPUT"
        echo "notarized=${NOTARIZED:-false}" >> "$GITHUB_OUTPUT"
