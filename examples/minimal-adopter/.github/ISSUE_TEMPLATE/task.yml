name: Task
description: A single verifiable unit of work tracked on the project board
title: '[Task] '
body:
  - type: markdown
    attributes:
      value: |
        Use this form for a unit of work that belongs on the project board. Fill in context,
        acceptance criteria, test plan, and evidence expectations before starting. See the
        project's `docs/TRACKER.md` for the board link and lifecycle.
  - type: textarea
    id: context
    attributes:
      label: Why / context
      description: What problem or outcome motivates this task? Link the release/sprint or parent item.
      placeholder: 'Context, links to the board item...'
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this task is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One testable criterion per line. Do not leave this implicit.
      placeholder: "- [ ] ...\n- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: test_plan
    attributes:
      label: Test plan
      description: Commands/checks, automated and manual, including negative and edge cases.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Verification evidence required
      description: Artifacts/logs/checksums expected before this task can move to Done.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / blockers
      description: Linked issues, PRs, decisions, or "none".
    validations:
      required: true
  - type: input
    id: estimate
    attributes:
      label: Estimate
      description: S / M / L or a time range.
      placeholder: 'M'
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: This task will follow the check-in/check-out lifecycle on the project board.
          required: true
        - label: No secrets, tokens, cookies, or private vulnerability details are included.
          required: true
        - label: Acceptance criteria are testable and evidence will be attached.
          required: true
