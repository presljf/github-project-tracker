# COPY-MODE EXAMPLE — reusable-mode macos release caller (T10).
#
# Non-runnable example: GitHub executes only workflows under .github/workflows/, and this file
# lives under profiles/. Copy it into your repository's .github/workflows/ and pin the tracker ref
# to the tag you adopted (replace @v1.3.2 below). The runnable self-repo caller is
# .github/workflows/release.yml.
#
# Reusable workflow: presljf/github-project-tracker/.github/workflows/reusable-release.yml (contract in
# docs/ACTIONS_CATALOG.md §7.5; profile details in docs/RELEASE_PROFILES.md).
#
# Profile: macos — build a dmg/zip, optionally Developer ID sign + notarize + staple when the
# macOS signing secrets are configured in the protected `release` environment. When the secrets
# are absent the reusable workflow skips cleanly on dry-runs and falls back to ad-hoc signing
# with an explicit warning on publish runs (never a silent unsigned publish).
#
# This template caller is dispatch-only and dry-run by default: the template repository ships no
# macOS app. Adopters replace the build-command with their real app build, add a `push: tags: v*`
# trigger, pass the secrets below, and configure the `release` environment with required reviewers
# and a tags-`v*`-only deployment rule before enabling publishing.
name: Release (macOS example)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to validate (for example v1.0.0). Empty uses 0.0.0-dryrun on a dry-run dispatch.'
        required: false
        type: string
        default: ''
      dry-run:
        description: 'Build and validate only; never sign/publish for real (default).'
        required: false
        type: boolean
        default: true
      publish:
        description: 'Request publishing. Honored only when dispatching on a release tag ref with dry-run disabled.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-macos:
    name: release-macos
    # GitHub requires the caller job to grant at least the union of permissions declared by the
    # called reusable workflow's jobs: contents: write (release job), packages: write (container
    # job), id-token: write (package OIDC publishing). Profile jobs that do not apply are skipped
    # and never use the extra grant; each called job still declares its own reduced permission set.
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: presljf/github-project-tracker/.github/workflows/reusable-release.yml@v1.3.2
    with:
      profile: macos
      version: ${{ inputs.version }}
      dry-run: ${{ inputs.dry-run }}
      publish: ${{ inputs.publish }}
      # Template placeholder: packages the repo docs as a zip so the macos pipeline can be
      # validated end-to-end. Replace with the real app build (produce .app/.dmg under dist/).
      build-command: |
        set -euo pipefail
        mkdir -p dist/staging
        cp -R docs dist/staging/docs
        cp README.md dist/staging/
        ditto -c -k --keepParent dist/staging "dist/ProjectTrackerOS-${VERSION}.zip"
      artifact-globs: |
        dist/*.zip
      node-version: '22'
      # Non-secret macOS inputs; values come from repo/environment variables in a real project.
      macos-team-id: ''
      macos-signing-identity: 'Developer ID Application'
    secrets:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
