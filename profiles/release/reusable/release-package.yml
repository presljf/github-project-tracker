# COPY-MODE EXAMPLE — reusable-mode package release caller (T10).
#
# Non-runnable example: GitHub executes only workflows under .github/workflows/, and this file
# lives under profiles/. Copy it into your repository's .github/workflows/ and pin the tracker ref
# to the tag you adopted (replace @v1.4.0 below). The runnable self-repo caller is
# .github/workflows/release.yml.
#
# Reusable workflow: presljf/github-project-tracker/.github/workflows/reusable-release.yml (contract in
# docs/ACTIONS_CATALOG.md §7.5; profile details in docs/RELEASE_PROFILES.md).
#
# Profile: package — build npm and/or PyPI distributions, checksum them, and publish with
# provenance/OIDC trusted publishing (preferred) in the protected `release` environment.
# Static-token fallbacks (`NPM_TOKEN`, `PYPI_API_TOKEN`) exist only for registries where trusted
# publishing is unavailable; they are optional secrets and are documented/rotated by the project.
#
# This template caller is dispatch-only and dry-run by default. The template repo is a private
# npm-style package with no registry target, so a dispatch only builds/checksums the tarball. To
# publish: replace the build-command as needed, add a `push: tags: v*` trigger, pass the optional
# token secrets only if OIDC is unavailable, and configure the `release` environment with required
# reviewers plus the registry-side trusted-publishing configuration.
name: Release (package example)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to validate (for example v1.0.0). Empty uses 0.0.0-dryrun on a dry-run dispatch.'
        required: false
        type: string
        default: ''
      dry-run:
        description: 'Build and validate only; never publish to a registry (default).'
        required: false
        type: boolean
        default: true
      publish:
        description: 'Request publishing. Honored only when dispatching on a release tag ref with dry-run disabled.'
        required: false
        type: boolean
        default: false
      contract-gate:
        description: >-
          Opt in to the adoption-contract gate (verify-tooling + verify-contract + offline
          release-gate) before build. Default false; the open-OI check stays a release-procedure step.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-package:
    name: release-package
    # GitHub requires the caller job to grant at least the union of permissions declared by the
    # called reusable workflow's jobs: contents: write (release job), packages: write (container
    # job), id-token: write (package OIDC publishing). Profile jobs that do not apply are skipped
    # and never use the extra grant; each called job still declares its own reduced permission set.
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: presljf/github-project-tracker/.github/workflows/reusable-release.yml@v1.4.0
    with:
      profile: package
      version: ${{ inputs.version }}
      dry-run: ${{ inputs.dry-run }}
      publish: ${{ inputs.publish }}
      # Opt in to the v1.4.0 adoption-contract gate; tracker-ref is the exact adopted tag.
      contract-gate: ${{ inputs.contract-gate }}
      tracker-ref: v1.4.0
      # Template placeholder: the template package.json is private and unversioned, so this
      # stages a versioned copy of the docs as a packable tarball to exercise the pipeline. For
      # a real project `npm pack` against the project package.json is sufficient; PyPI projects
      # should build wheels/sdists into dist/ (for example `python -m build`).
      build-command: |
        set -euo pipefail
        mkdir -p dist .release-package
        node -e 'const fs = require("node:fs"); const version = process.env.VERSION; fs.writeFileSync(".release-package/package.json", JSON.stringify({ name: "project-tracker-os", version, private: false, description: "Project Tracker OS template release bundle (validation artifact)", files: ["docs/**"] }, null, 2) + "\n");'
        cp -R docs .release-package/docs
        ( cd .release-package && npm pack --pack-destination ../dist )
        rm -rf .release-package
      artifact-globs: |
        dist/*.tgz
      node-version: '22'
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
