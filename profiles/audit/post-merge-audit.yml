# COPY-MODE EXAMPLE — reusable-mode post-merge bypass audit caller (T04).
#
# Non-runnable example: GitHub executes only workflows under .github/workflows/, and this file
# lives under profiles/. Copy it into your repository's .github/workflows/post-merge-audit.yml,
# replace both pinned @v1.3.2 refs (the `uses:` reusable-workflow ref and the `tracker-ref` input)
# with the exact tag/SHA you adopted (v1.4.0+ — the first release that ships
# reusable-post-merge-audit.yml), and update your required checks (old→new mapping in
# profiles/audit/README.md).
#
# Reusable workflow: presljf/github-project-tracker/.github/workflows/reusable-post-merge-audit.yml
# (contract in docs/ACTIONS_CATALOG.md §7.11; profile details in profiles/audit/README.md).
#
# Least privilege: the caller job must grant at least the called job's union — issues: write opens
# the tracker-contract-exception OI, and checks/statuses/actions read are required for
# statusCheckRollup (its GraphQL query resolves checkSuite.workflowRun). The reusable workflow
# verifies the target PR is actually merged before auditing, and degrades an unreadable rollup to a
# warning + closure-only audit (exit 0, no false OI).
name: Post-merge bypass audit

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'Merged PR number to audit (required for manual dispatch).'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: post-merge-audit-${{ github.event.pull_request.number || inputs['pr-number'] }}
  cancel-in-progress: false

jobs:
  post-merge-audit:
    name: post-merge-audit
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    permissions:
      contents: read
      issues: write
      pull-requests: read
      checks: read
      statuses: read
      actions: read
    uses: presljf/github-project-tracker/.github/workflows/reusable-post-merge-audit.yml@v1.3.2
    with:
      tracker-ref: v1.3.2
      config-path: tracker.config.json
      pr-number: ${{ github.event_name == 'workflow_dispatch' && inputs['pr-number'] || '' }}
