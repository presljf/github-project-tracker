# COPY-MODE EXAMPLE — reusable-mode counts docs verification caller (T05).
#
# Non-runnable example: GitHub executes only workflows under .github/workflows/, and this file
# lives under profiles/. Copy it into your repository's .github/workflows/counts-docs.yml, replace
# both pinned @v1.3.2 refs (the `uses:` reusable-workflow ref and the `tracker-ref` input) with the
# exact release tag (`@v<version>`) you adopted (v1.4.0+ — the first release that ships reusable-counts.yml), and update
# the required checks if you promote it (context `counts-docs / counts`).
#
# Reusable workflow: presljf/github-project-tracker/.github/workflows/reusable-counts.yml
# (contract in docs/ACTIONS_CATALOG.md §7.13; profile details in profiles/counts/README.md).
#
# Runs only `guard-docs-counts`: committed baseline schema/agreement + generated doc + inline
# markers freshness. It never runs the suite inventory and uploads no artifacts. Absent
# `docs.counts` config is a documented no-op (exit 0), so adopting this caller before wiring counts
# is safe; once counts are adopted, make this a required check.
name: Counts docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: counts-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  counts-docs:
    name: counts-docs
    permissions:
      contents: read
    uses: presljf/github-project-tracker/.github/workflows/reusable-counts.yml@v1.3.2
    with:
      tracker-ref: v1.3.2
      config-path: tracker.config.json
